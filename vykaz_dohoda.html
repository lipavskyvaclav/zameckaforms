<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Výkaz práce</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            padding: 15px;
        }

        .container {
            max-width: 210mm;
            margin: 0 auto;
            background: white;
            padding: 12mm 12mm 10mm 12mm;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 15px;
            font-size: 22px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .form-group { margin-bottom: 10px; }

        label {
            display: block;
            font-weight: bold;
            color: #333;
            margin-bottom: 4px;
            font-size: 13px;
        }

        input[type="text"], select {
            width: 100%;
            padding: 5px;
            border: 1px solid #999;
            border-radius: 3px;
            font-size: 14px;
            font-family: Arial, sans-serif;
            background: white;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #4CAF50;
        }

        .row { display: flex; gap: 12px; }
        .row .form-group { flex: 1; }

        .table-wrapper { margin: 12px 0; }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        table th {
            background-color: #4CAF50;
            color: white;
            padding: 5px 3px;
            text-align: center;
            font-size: 11px;
            border: 1px solid #388e3c;
            vertical-align: middle;
            line-height: 1.2;
        }

        table td {
            border: 1px solid #ccc;
            padding: 2px 4px;
            text-align: center;
            vertical-align: middle;
            height: 24px;
        }

        table tr:nth-child(even) { background-color: #f9f9f9; }
        table tr.total-row { background-color: #e8f5e9 !important; font-weight: bold; }
        table tr.today-row { background-color: #fff9c4 !important; }

        td.day-num {
            font-weight: bold;
            font-size: 12px;
            width: 25px;
        }
        td.day-name {
            font-size: 11px;
            color: #555;
            width: 25px;
        }
        td.weekend { background-color: #fce4ec !important; color: #c62828; }

        input.time-input {
            width: 42px;
            padding: 2px;
            font-size: 12px;
            border: 1px solid #ccc;
            border-radius: 2px;
            text-align: center;
            font-family: Arial, sans-serif;
        }
        input.time-input:focus { border-color: #4CAF50; outline: none; }

        td.time-pair { white-space: nowrap; padding: 2px 4px; }

        td.hours-cell {
            font-weight: bold;
            font-size: 12px;
            color: #1a6e1a;
            width: 50px;
        }
        td.sick-cell { width: 35px; }
        td.sick-cell input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .signature-section {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 2px solid #333;
        }
        .sig-row { display: flex; gap: 40px; margin-top: 8px; }
        .sig-box { flex: 1; }
        .sig-box label { font-size: 12px; font-weight: bold; }
        .sig-line { margin-top: 35px; border-bottom: 1px solid #333; }

        .summary-box {
            background-color: #e8f5e9;
            border: 1px solid #a5d6a7;
            padding: 8px 15px;
            margin: 10px 0;
            font-size: 14px;
            border-radius: 3px;
            display: flex;
            gap: 25px;
        }
        .summary-box span { font-weight: bold; color: #1a6e1a; }

        .buttons {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover { background-color: #45a049; }
        .save-btn { background-color: #2196F3; }
        .save-btn:hover { background-color: #0b7dda; }
        .clear-btn { background-color: #f44336; }
        .clear-btn:hover { background-color: #c62828; }

        @media print {
            body { background: white; padding: 0; }
            .container {
                box-shadow: none;
                padding: 0;
                max-width: 100%;
            }
            .buttons { display: none; }

            select, input[type="text"] {
                border: none;
                border-bottom: 1px solid #000;
                border-radius: 0;
                background: transparent;
                -webkit-appearance: none;
                appearance: none;
            }

            table th {
                background-color: #4CAF50 !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            td.weekend {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            table tr.total-row {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .summary-box {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            input.time-input {
                border: none;
                border-bottom: 1px solid #555;
                border-radius: 0;
                background: transparent;
            }

            @page {
                size: A4 portrait;
                margin: 10mm;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Výkaz práce</h1>

    <div class="row">
        <div class="form-group" style="flex:0.7">
            <label for="rok">Rok:</label>
            <select id="rok"></select>
        </div>
        <div class="form-group" style="flex:1.3">
            <label for="mesic">Měsíc:</label>
            <select id="mesic">
                <option value="1">Leden</option>
                <option value="2">Únor</option>
                <option value="3">Březen</option>
                <option value="4">Duben</option>
                <option value="5">Květen</option>
                <option value="6">Červen</option>
                <option value="7">Červenec</option>
                <option value="8">Srpen</option>
                <option value="9">Září</option>
                <option value="10">Říjen</option>
                <option value="11">Listopad</option>
                <option value="12">Prosinec</option>
            </select>
        </div>
        <div class="form-group" style="flex:3">
            <label for="pracovnik">Příjmení a jméno pracovníka:</label>
            <input type="text" id="pracovnik">
        </div>
    </div>

    <div class="table-wrapper">
        <table id="vykaz-table">
            <thead>
                <tr>
                    <th rowspan="2">Den</th>
                    <th rowspan="2"></th>
                    <th colspan="2">Příchod / odchod 1</th>
                    <th colspan="2">Příchod / odchod 2</th>
                    <th colspan="2">Příchod / odchod 3</th>
                    <th rowspan="2">Odprac.<br>hodin</th>
                    <th rowspan="2">Nemoc</th>
                </tr>
                <tr>
                    <th>od</th><th>do</th>
                    <th>od</th><th>do</th>
                    <th>od</th><th>do</th>
                </tr>
            </thead>
            <tbody id="table-body"></tbody>
            <tfoot>
                <tr class="total-row">
                    <td colspan="8" style="text-align:right; padding-right:8px; font-size:12px;">CELKEM:</td>
                    <td id="total-hours" class="hours-cell">0:00</td>
                    <td id="total-sick" style="font-weight:bold; color:#c62828; font-size:12px;">0</td>
                </tr>
            </tfoot>
        </table>
    </div>

    <div class="summary-box">
        Celkem odpracováno: <span id="sum-hours">0:00</span> hodin &nbsp;|&nbsp;
        Dny nemoci: <span id="sum-sick">0</span>
    </div>

    <div class="signature-section">
        <div class="sig-row">
            <div class="sig-box">
                <label>Podpis pracovníka:</label>
                <div class="sig-line"></div>
            </div>
            <div class="sig-box">
                <label>Kontroloval/a:</label>
                <div class="sig-line"></div>
            </div>
        </div>
    </div>

    <div class="buttons">
        <button class="save-btn" onclick="saveForm()">💾 Uložit</button>
        <button onclick="window.print()">🖨️ Vytisknout</button>
        <button class="clear-btn" onclick="clearForm()">🗑️ Vymazat</button>
    </div>
</div>

<script>
    const DNY = ['Ne','Po','Út','St','Čt','Pá','So'];
    let isFirstLoad = true;

    function initYears() {
        const sel = document.getElementById('rok');
        const savedYear = sel.querySelector('option[selected]')?.value;
        sel.innerHTML = '';
        const now = new Date().getFullYear();
        for (let y = now - 2; y <= now + 5; y++) {
            const opt = document.createElement('option');
            opt.value = y;
            opt.textContent = y;
            if (savedYear && String(y) === savedYear) {
                opt.selected = true;
            }
            sel.appendChild(opt);
        }
    }

    function initMonth() {
        const sel = document.getElementById('mesic');
        if (sel.querySelector('option[selected]')) return;
    }

    function createTimeInput(id) {
        const inp = document.createElement('input');
        inp.type = 'text';
        inp.className = 'time-input';
        inp.id = id;
        inp.placeholder = '--:--';
        inp.maxLength = 5;
        inp.setAttribute('inputmode', 'numeric');

        inp.addEventListener('input', function(e) {
            let v = e.target.value.replace(/[^0-9:]/g, '');
            const digits = v.replace(/:/g, '');
            if (digits.length >= 3 && !v.includes(':')) {
                v = digits.slice(0,2) + ':' + digits.slice(2,4);
            }
            e.target.value = v.slice(0,5);
        });

        inp.addEventListener('blur', function(e) {
            const v = e.target.value.trim();
            if (!v) return;
            if (!/^\d{1,2}:\d{2}$/.test(v)) { e.target.value = ''; return; }
            const [h, m] = v.split(':').map(Number);
            if (h > 23 || m > 59) { e.target.value = ''; return; }
            e.target.value = String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
            recalcFromRow(inp.closest('tr'));
        });

        return inp;
    }

    function timeToMinutes(v) {
        if (!v) return null;
        const m = v.match(/^(\d{1,2}):(\d{2})$/);
        if (!m) return null;
        return parseInt(m[1]) * 60 + parseInt(m[2]);
    }

    // Zaokrouhlování na půlhodiny
    function minutesToDisplay(totalMin) {
        const half = Math.floor(totalMin / 30);
        const h = Math.floor(half / 2);
        const m = (half % 2) * 30;
        return `${h}:${String(m).padStart(2,'0')}`;
    }

    function parseDisplay(text) {
        if (!text) return 0;
        const p = text.match(/^(\d+):(\d{2})$/);
        if (!p) return 0;
        return parseInt(p[1]) * 60 + parseInt(p[2]);
    }

    function recalcFromRow(row) {
        if (!row) return;
        recalcRowEl(row);
        updateTotals();
    }

    function recalcRowEl(row) {
        const sick = row.querySelector('.sick-cb');
        const hoursCell = row.querySelector('.hours-cell');
        if (!sick || !hoursCell) return;

        if (sick.checked) {
            hoursCell.textContent = '0:00';
            hoursCell.style.color = '#c62828';
            return;
        }

        const d = row.dataset.day;
        let totalMin = 0;
        for (let i = 1; i <= 3; i++) {
            const od = row.querySelector(`#od${i}_${d}`);
            const do_ = row.querySelector(`#do${i}_${d}`);
            if (!od || !do_) continue;
            const odMin = timeToMinutes(od.value.trim());
            const doMin = timeToMinutes(do_.value.trim());
            if (odMin !== null && doMin !== null && doMin > odMin) {
                totalMin += doMin - odMin;
            }
        }

        hoursCell.textContent = minutesToDisplay(totalMin);
        hoursCell.style.color = totalMin > 0 ? '#1a6e1a' : '#333';
    }

    function updateTotals() {
        let totalMin = 0;
        let totalSick = 0;
        document.querySelectorAll('#table-body tr').forEach(row => {
            const hoursCell = row.querySelector('.hours-cell');
            const sick = row.querySelector('.sick-cb');
            if (hoursCell) totalMin += parseDisplay(hoursCell.textContent);
            if (sick && sick.checked) totalSick++;
        });

        // Celkové zobrazení udrží formátování už s nasčítanými půlhodinami
        const h = Math.floor(totalMin / 60);
        const m = totalMin % 60;
        const display = `${h}:${String(m).padStart(2,'0')}`;
        
        document.getElementById('total-hours').textContent = display;
        document.getElementById('total-sick').textContent = totalSick;
        document.getElementById('sum-hours').textContent = display;
        document.getElementById('sum-sick').textContent = totalSick;
    }

    function buildTable() {
        const rokVal = document.getElementById('rok').value;
        const mesicVal = document.getElementById('mesic').value;
        if (!rokVal || !mesicVal) return;

        const rok = parseInt(rokVal);
        const mesic = parseInt(mesicVal);
        const daysInMonth = new Date(rok, mesic, 0).getDate();
        const today = new Date();

        const tbody = document.getElementById('table-body');

        // Záchrana dat při otevření již uloženého souboru
        const savedData = {};
        const savedSick = {};
        
        if (isFirstLoad) {
            document.querySelectorAll('input.time-input').forEach(inp => {
                const val = inp.getAttribute('value');
                if (val) savedData[inp.id] = val;
            });
            document.querySelectorAll('.sick-cb').forEach(cb => {
                const r = cb.closest('tr');
                if (r && r.dataset.day && cb.hasAttribute('checked')) {
                    savedSick[r.dataset.day] = true;
                }
            });
        }

        tbody.innerHTML = '';

        for (let d = 1; d <= daysInMonth; d++) {
            const date = new Date(rok, mesic - 1, d);
            const dow = date.getDay();
            const isWeekend = dow === 0 || dow === 6;
            const isToday = today.getDate() === d && today.getMonth() === mesic - 1 && today.getFullYear() === rok;

            const tr = document.createElement('tr');
            tr.dataset.day = d;
            if (isToday) tr.classList.add('today-row');

            const wc = isWeekend ? ' weekend' : '';

            const tdDay = document.createElement('td');
            tdDay.className = 'day-num' + wc;
            tdDay.textContent = d;

            const tdDow = document.createElement('td');
            tdDow.className = 'day-name' + wc;
            tdDow.textContent = DNY[dow];

            tr.appendChild(tdDay);
            tr.appendChild(tdDow);

            for (let i = 1; i <= 3; i++) {
                const tdOd = document.createElement('td');
                tdOd.className = 'time-pair' + wc;
                const inpOd = createTimeInput(`od${i}_${d}`);
                if (isFirstLoad && savedData[inpOd.id]) inpOd.value = savedData[inpOd.id];
                tdOd.appendChild(inpOd);

                const tdDo = document.createElement('td');
                tdDo.className = 'time-pair' + wc;
                const inpDo = createTimeInput(`do${i}_${d}`);
                if (isFirstLoad && savedData[inpDo.id]) inpDo.value = savedData[inpDo.id];
                tdDo.appendChild(inpDo);

                tr.appendChild(tdOd);
                tr.appendChild(tdDo);
            }

            const tdHours = document.createElement('td');
            tdHours.className = 'hours-cell' + wc;
            tdHours.textContent = '0:00';

            const tdSick = document.createElement('td');
            tdSick.className = 'sick-cell' + wc;
            const cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.className = 'sick-cb';
            
            if (isFirstLoad && savedSick[d]) {
                cb.checked = true;
            }

            cb.addEventListener('change', function() {
                if (this.checked) {
                    for (let i = 1; i <= 3; i++) {
                        const od = tr.querySelector(`#od${i}_${d}`);
                        const do_ = tr.querySelector(`#do${i}_${d}`);
                        if (od) od.value = '';
                        if (do_) do_.value = '';
                    }
                }
                recalcRowEl(tr);
                updateTotals();
            });
            tdSick.appendChild(cb);

            tr.appendChild(tdHours);
            tr.appendChild(tdSick);
            tbody.appendChild(tr);
        }

        isFirstLoad = false;

        // Přepočítá všechny řádky z načtených dat
        document.querySelectorAll('#table-body tr').forEach(tr => recalcRowEl(tr));
        updateTotals();
    }

    document.getElementById('rok').addEventListener('change', buildTable);
    document.getElementById('mesic').addEventListener('change', buildTable);

    function saveForm() {
        document.querySelectorAll('input[type="text"], input.time-input').forEach(i => i.setAttribute('value', i.value));
        
        // ZDE JE OPRAVA PRO PADÁNÍ MĚSÍCE NA LEDEN
        document.querySelectorAll('select').forEach(s => {
            const currentValue = s.value; // Uložíme si hodnotu stranou
            s.querySelectorAll('option').forEach(o => {
                o.removeAttribute('selected');
                if (o.value === currentValue) {
                    o.setAttribute('selected', 'selected');
                }
            });
            s.value = currentValue; // Pro jistotu vrátíme hodnotu roletce zpět
        });

        document.querySelectorAll('input[type="checkbox"]').forEach(cb => {
            if (cb.checked) cb.setAttribute('checked', 'checked');
            else cb.removeAttribute('checked');
        });
        
        document.querySelectorAll('.hours-cell').forEach(td => {
            td.setAttribute('data-val', td.textContent);
        });

        const htmlContent = document.documentElement.outerHTML;
        const rok = document.getElementById('rok').value;
        const mesic = String(document.getElementById('mesic').value).padStart(2,'0');
        const pracovnik = document.getElementById('pracovnik').value.replace(/[^a-z0-9]/gi, '-').toLowerCase() || 'vykaz';
        const filename = `vykaz-prace-${pracovnik}-${rok}-${mesic}.html`;

        const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = filename; a.click();
        URL.revokeObjectURL(url);
        alert('Formulář byl uložen!');
    }

    function clearForm() {
        if (!confirm('Opravdu chcete vymazat všechna data?')) return;
        document.getElementById('pracovnik').value = '';
        document.querySelectorAll('#table-body tr').forEach(row => {
            row.querySelectorAll('input.time-input').forEach(i => i.value = '');
            const cb = row.querySelector('.sick-cb');
            if (cb) cb.checked = false;
            const hc = row.querySelector('.hours-cell');
            if (hc) { hc.textContent = '0:00'; hc.style.color = '#333'; }
        });
        updateTotals();
    }

    // Inicializace
    initYears();
    initMonth();
    buildTable();
</script>
</body>
</html>
